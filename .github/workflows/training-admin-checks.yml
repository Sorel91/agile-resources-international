name: Training administration checks
on:
  push:
    branches: ["prepare/training-registration-admin"]
  pull_request:
    paths:
      - "admin/**"
      - "supabase/**"
      - "tests/**"
      - "training-public-key.php"
      - "training-registration.php"
      - "assets/site.js"
      - "assets/workshop-registration*"
      - "index.html"
      - ".github/workflows/training-admin-checks.yml"
permissions:
  contents: read
jobs:
  php-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install PHP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-curl
      - name: Check PHP syntax
        run: |
          php -l admin/bootstrap.php
          php -l admin/index.php
          php -l admin/training-signing.php
          php -l training-public-key.php
          php -l training-registration.php
          php -l admin/training-public.php
          php -l admin/training-store.php
          php -l admin/formations.php
          php -l tests/training-integration.php
      - name: Test private client and signatures
        run: php tests/training-integration.php
      - name: Check public JavaScript
        run: |
          node --check assets/site.js
          node --check assets/workshop-registration-v2.js
      - name: Test public registration interactions
        run: |
          npm ci --prefix tests --ignore-scripts
          node tests/training-form-dom.cjs
      - name: Test Supabase handler
        run: node --experimental-strip-types tests/training-supabase.mts
      - name: Test unauthenticated access
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/ari-php-server.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            if curl -s -o /dev/null http://127.0.0.1:8080/admin/; then break; fi
            sleep 1
          done
          for path in "/admin/formations.php" "/admin/formations.php?export=csv" "/admin/formations.php?cv=1"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$path")"
            test "$code" = 303
          done
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/training-registration.php)"
          test "$code" = 403
